name: Deploy SarawakMart

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sarawakmart-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p deployment/modules
          cp index.php deployment/
          cp -r assets deployment/
          cp -r includes deployment/
          cp -r modules/catalog deployment/modules/

      - name: Deploy website via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deployment/
          server-dir: /htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/*.sql
            **/*.md
            **/*.zip
            **/config/**
            **/uploads/**